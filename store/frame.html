<!doctype html><html><head><meta charset=utf-8><style>
*{margin:0;box-sizing:border-box}html,body{width:1320px;height:2868px;background:#07090e;overflow:hidden;font-family:-apple-system,"SF Pro Display",Helvetica,Arial,sans-serif}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 40% at 50% 62%,rgba(79,227,184,.22),transparent 70%)}
h1{position:absolute;top:170px;left:90px;right:90px;text-align:center;color:#f3f5f9;font-size:104px;line-height:1.04;font-weight:800;letter-spacing:-3px}
h1 em{font-style:normal;color:#4fe3b8}
p{position:absolute;top:440px;left:120px;right:120px;text-align:center;color:#8b93a5;font-size:46px;line-height:1.3}
.phone{position:absolute;left:50%;top:640px;transform:translateX(-50%);width:980px;height:2130px;border-radius:120px;background:#000;padding:26px;box-shadow:0 0 0 4px #26303d,0 60px 160px rgba(0,0,0,.6)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:96px;display:block}
</style></head><body><div class=bg></div><h1 id=h></h1><p id=s></p><div class=phone><img id=i></div>
<script>const q=new URLSearchParams(location.search);document.getElementById('h').innerHTML=q.get('h');document.getElementById('s').textContent=q.get('s');document.getElementById('i').src=q.get('i')</script></body></html>
